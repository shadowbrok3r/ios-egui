<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- A band seen in three-quarter view, the way the app's own viewport frames it, over the
       petrobond-dark background the UI uses. The ellipse is the ring; the pen nib crossing it is
       what the app is for. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23242a"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <!-- Gold, lit from the upper left like the Metal shade mode. -->
    <linearGradient id="metal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#fbf3d2"/>
      <stop offset="0.35" stop-color="#e3cf92"/>
      <stop offset="0.62" stop-color="#b99f5c"/>
      <stop offset="1"    stop-color="#e8d9a6"/>
    </linearGradient>
    <!-- The bore has to go dark fast or the hole reads as a plate at 48 px. Only the far inner
         wall catches light; the near half is in shadow because you are looking past it. -->
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#8e7846"/>
      <stop offset="0.45" stop-color="#3a3324"/>
      <stop offset="1"    stop-color="#15161a"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#8f6fd0"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- The band: an outer ellipse with an elliptical hole, so it reads as a ring in perspective. -->
  <g transform="translate(96 104)">
    <path d="M -72 0 a 72 44 0 1 0 144 0 a 72 44 0 1 0 -144 0
             M -44 -3 a 44 25 0 1 1 88 0 a 44 25 0 1 1 -88 0"
          fill="url(#metal)" fill-rule="evenodd"/>
    <!-- Shadowed inner wall, which is what makes the hole look like a bore. -->
    <path d="M -44 -3 a 44 25 0 0 1 88 0 a 44 25 0 0 1 -88 0" fill="url(#inner)"/>
    <!-- Specular running along the near crest. -->
    <path d="M -52 26 a 62 34 0 0 0 104 0" fill="none" stroke="#fffbe9" stroke-opacity="0.55"
          stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- S-Pen nib, tip on the band's near face. -->
  <g transform="translate(126 44) rotate(38)">
    <rect x="-9" y="0" width="18" height="62" rx="6" fill="url(#nib)"/>
    <path d="M -9 62 L 9 62 L 0 84 Z" fill="url(#nib)"/>
    <path d="M -3.2 74 L 3.2 74 L 0 84 Z" fill="#1b1c21"/>
  </g>
</svg>
