[package]
name = "ringdesigner_android"
version = "0.4.0"
edition = "2024"
publish = false

# rlib as well as cdylib so the pure modules stay host-testable with `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui-mobile = { path = "../../crates/egui-mobile" }
egui = "0.36"
# Direct, not via egui-mobile, which does not re-export it. Must be the same 0.36 egui_glow the
# runtime uses: two copies in the graph make the paint callback's downcast fail, and the only
# symptom is a blank viewport and one `Unsupported render callback` warning.
egui_glow = "0.36"
log = "0.4"
serde_json = "1"
# Plain HTTP to the desktop over Tailscale; no TLS on purpose, the tailnet is the boundary.
minreq = "3"
# The geometry, unchanged. Lives in another workspace; cargo resolves its own
# `.workspace = true` inheritance from its own root, so a plain path dep is enough.
ringdesign-core = { path = "../../../../JewelryProjects/RingDesigner/crates/ringdesign-core" }

# cargo-apk2 reads this to generate the APK manifest.
[package.metadata.android]
package = "com.kingsofalchemy.ringdesigner"
java_sources = "../../crates/egui-android/java"
# Launcher icon mipmaps, rendered from icon/ic_launcher.svg by scripts/render-icons.sh.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

# The shared debug keystore every app in this repo signs with — a different key makes
# future updates fail INSTALL_FAILED_UPDATE_INCOMPATIBLE.
[package.metadata.android.signing.release]
path = "/home/shadowbroker/.android/debug.keystore"
keystore_password = "android"

[package.metadata.android.application]
label = "RingDesigner"
icon = "@mipmap/ic_launcher"
has_code = true

# Without this stanza cargo-apk2 emits no launcher activity: the APK installs and
# reports as present, but has no home-screen entry.
[[package.metadata.android.application.activity]]
name = "com.github.egui_mobile.EguiNativeActivity"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|density"
window_soft_input_mode = "adjustResize"
[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "ringdesigner_android"
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

# Read the gallery so a photograph of a real surface can become an alpha. Images only — there is
# no video source here.
# Reaching the desktop's sync endpoint over the tailnet.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"
# Android 14+ hands out a partial "Select photos" grant instead of a full one; an app targeting 34+
# that asks for READ_MEDIA_IMAGES must declare this too or the partial choice reads as a denial.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"
# Pre-Android-13 devices, where the scoped permissions do not exist.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32
[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"
