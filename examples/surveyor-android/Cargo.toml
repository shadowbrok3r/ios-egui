[package]
name = "surveyor_android"
version = "0.1.3"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui-mobile = { path = "../../crates/egui-mobile" }
egui = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain-HTTP LAN client to the RuView sensing server; no TLS on purpose.
minreq = "2"
# Sync WebSocket client, no TLS features.
tungstenite = "0.24"
log = "0.4"

# Real backdrop blur behind the nav bar: a grab-pass that samples the live
# framebuffer inside an egui paint callback — needs the Glow backend
# (egui_mobile::Backend::Glow in app.rs). See patches/backdrop-blur.
[target.'cfg(target_os = "android")'.dependencies]
backdrop-blur-egui = { path = "../../patches/backdrop-blur/crates/backdrop-blur-egui", default-features = false, features = ["grab-pass"] }

# cargo-apk2 reads this to generate the APK manifest.
[package.metadata.android]
package = "com.kingsofalchemy.surveyor"
java_sources = "../../crates/egui-android/java"
# Launcher icon mipmaps, rendered from icon/ic_launcher.svg by scripts/render-icons.sh.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

# Same shared debug keystore as every app in this repo — a different key
# would make future updates fail INSTALL_FAILED_UPDATE_INCOMPATIBLE.
[package.metadata.android.signing.release]
path = "/home/shadowbroker/.android/debug.keystore"
keystore_password = "android"

[package.metadata.android.application]
label = "Surveyor"
icon = "@mipmap/ic_launcher"
has_code = true

# Without this stanza cargo-apk2 emits no launcher activity: the APK installs
# and reports as present, but has no home-screen entry at all.
[[package.metadata.android.application.activity]]
name = "com.github.egui_mobile.EguiNativeActivity"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|density"
window_soft_input_mode = "adjustResize"
[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "surveyor_android"
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"
