[workspace]
resolver = "3"
members = [
    "crates/egui-mobile-core",
    "crates/egui-mobile",
    "crates/egui-ios",
    "crates/egui-android",
    "examples/android-hello",
    "examples/plugins-android",
    "examples/comfyui-android",
    "examples/privaxy-android",
    "examples/appstore-android",
    "examples/surveyor-android",
    "crates/cargo-egui-ios",
    "crates/cargo-egui-android",
    "crates/cargo-egui-mobile",
    "crates/plugin-abi",
    "crates/plugin-host",
    "crates/plugin-sdk",
    "crates/qnn-rs",
    "crates/local-sd",
    "crates/local-anima",
    "crates/local-wd14",
    "crates/local-clip",
    "crates/local-rewrite",
    "examples/hello/rust",
    "examples/desktop-host",
    "examples/plugins-ios/rust",
]
exclude = [
    "template",
    "template-plugin",
    "plugins",
    "patches/ndk-build2",
    "patches/cargo-apk2",
    # Its own workspace; consumed by path from privaxy-android.
    "patches/backdrop-blur",
    "patches/egui-json-tree",
    # Repinned to egui 0.36; reach the graph through [patch.crates-io], not as members.
    "patches/egui-snarl",
    "patches/egui-scale",
    "patches/rucomfyui-node-graph",
]
# egui-android only builds for android targets (android-activity/eframe-android), so it is a
# member (buildable via `cargo ndk -p egui-android`) but excluded from the default host build.
default-members = [
    "crates/egui-mobile-core",
    "crates/egui-mobile",
    "crates/egui-ios",
    "crates/cargo-egui-ios",
    "crates/cargo-egui-android",
    "crates/cargo-egui-mobile",
    "crates/plugin-abi",
    "crates/plugin-host",
    "crates/plugin-sdk",
    "examples/hello/rust",
    "examples/desktop-host",
    "examples/plugins-ios/rust",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shadowbrok3r/egui-ios"

# winit/egui-winit call hide_soft_input(HIDE_IMPLICIT_ONLY) on every IME interrupt; with the
# egui-android EditText bridge that hide sticks (DecorView show is ignored). Skip implicit-only
# hides so the bridge owns keyboard dismiss.
[patch.crates-io]
android-activity = { path = "patches/android-activity" }
# The comfyui graph editor's stack: all three still pin egui 0.35 upstream, and a second egui in
# the graph makes their types incompatible with the app's.
egui-snarl = { path = "patches/egui-snarl" }
egui-scale = { path = "patches/egui-scale" }

[patch."https://github.com/philpax/rucomfyui"]
rucomfyui_node_graph = { path = "patches/rucomfyui-node-graph" }

[workspace.dependencies]
egui = "0.36"
egui-wgpu = "0.36"
eframe = "0.36"
wgpu = "30"
pollster = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", features = ["use-std"] }
bytemuck = "1"
wasmtime = { version = "47", default-features = false, features = ["runtime", "cranelift", "pulley", "std"] }
wasmtime-wasi = "47"
anyhow = "1"
log = "0.4"
toml = "1"
egui-ios-plugin-abi = { path = "crates/plugin-abi" }
egui-ios-plugin-host = { path = "crates/plugin-host" }
egui-mobile-core = { path = "crates/egui-mobile-core" }
egui-ios = { path = "crates/egui-ios" }
egui-android = { path = "crates/egui-android" }
