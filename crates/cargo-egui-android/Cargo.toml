[package]
name = "cargo-egui-android"
description = "Cargo subcommand to scaffold, cross-compile, and run native egui Android apps via cargo-apk2 + adb."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Reads the app manifest's `java_sources` and `cargo metadata` to sync the Java bridge.
serde_json = "1"
toml.workspace = true

[[bin]]
name = "cargo-egui-android"
path = "src/main.rs"
